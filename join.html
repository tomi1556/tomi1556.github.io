<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="灯籠をつないで夜の世界を広げる、Java版・統合版対応のMinecraftサバイバルサーバー「灯原」。">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>灯原 はじめる</title>
<link rel="stylesheet" href="./assets/tomo.css">
</head>
<body>
<div id="app"></div>
<template id="dc">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=DotGothic16&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0A1226}
a{color:#F2B544}a:hover{color:#FFD98A}
.dev-ic{flex:none;width:48px;height:48px;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;position:relative}
.tl-i{position:relative;padding:0 24px 0 0}
.tl-line{position:absolute;top:22px;left:44px;right:0;height:4px;background:repeating-linear-gradient(90deg,#F2B544 0 8px,transparent 8px 14px);opacity:.55;animation:march 1.2s linear infinite}
@keyframes march{to{background-position:14px 0}}
.tl-lamp{position:relative;z-index:1;width:44px;height:48px;display:flex;flex-direction:column;align-items:center}
.tl-cap{width:30px;height:6px;background:#2A1E16}
.tl-head{width:26px;height:30px;background:#F2B544;border:4px solid #2A1E16;box-shadow:0 0 22px 6px rgba(242,181,68,.45)}
.rule{display:flex;gap:16px;align-items:baseline;padding:18px 0;border-bottom:2px solid rgba(255,255,255,.08);font-size:17px}
.rule-b{flex:none;width:12px;height:12px;background:#F2B544;transform:translateY(-2px)}
</style>
</helmet>

<div class="tb" style="width: 100%">
  <div class="hero" ref="{{setHero}}" onMouseMove="{{onMove}}" style="min-height: 620px">
    <div class="sky"></div>
    <div class="stars"><sc-for list="{{stars}}" as="s" hint-placeholder-count="30"><span class="star" style="{{s.style}}"></span></sc-for></div>
    <div class="moon" style="top: 120px; right: 20%; width: 56px; height: 56px"></div>
    <div class="dusk"></div>
    <header class="hdr">
      <div class="wrap hdr-in">
        <a href="index.html" class="logo">
          <svg width="30" height="36" viewBox="0 0 10 12" aria-hidden="true" style="display: block; shape-rendering: crispEdges"><rect x="2" y="0" width="6" height="1" fill="currentColor"></rect><rect x="1" y="1" width="8" height="1" fill="currentColor"></rect><rect x="1" y="2" width="1" height="6" fill="currentColor"></rect><rect x="8" y="2" width="1" height="6" fill="currentColor"></rect><rect x="2" y="2" width="6" height="6" fill="#F2B544"></rect><rect x="4" y="4" width="2" height="2" fill="#FFF1C4"></rect><rect x="1" y="8" width="8" height="1" fill="currentColor"></rect><rect x="4" y="9" width="2" height="3" fill="currentColor"></rect></svg>
          <span class="disp" style="font-size: 26px; line-height: 1">灯原</span>
        </a>
        <nav class="nav" aria-label="メイン">
          <a href="index.html" class="nl"><span class="nl-lamp"></span>トップ</a>
          <a href="join.html" class="nl cur" aria-current="page"><span class="nl-lamp"></span>はじめる</a>
          <a href="season.html" class="nl"><span class="nl-lamp"></span>シーズン</a>
          <a href="events.html" class="nl"><span class="nl-lamp"></span>夜祭</a>
          <a href="community.html" class="nl"><span class="nl-lamp"></span>仲間と遊ぶ</a>
        </nav>
      </div>
    </header>
    <div class="wrap" style="position: relative; z-index: 3; padding-top: 64px; padding-bottom: 24px">
      <p class="depth fadein" style="color: #BFC9DB">はじめる</p>
      <h1 class="disp reveal" style="margin: 16px 0 0; font-size: clamp(40px, 6.4vw, 88px); line-height: 1.15">3分で、最初の夜へ。</h1>
      <p class="lead fadein" style="margin-top: 22px; font-size: 18px">遊んでいる機種を選ぶと、その機種だけの手順が出ます。</p>
    </div>
    <div class="scene" aria-hidden="true" style="height: 210px">
      <div class="layer l1" style="height: 170px"><svg viewBox="0 0 960 250" preserveAspectRatio="none"><polygon points="{{farPts}}" fill="#17274E"></polygon></svg></div>
      <div class="layer l3" style="height: 150px">
        <div class="terrain">
          <sc-for list="{{cols}}" as="c" hint-placeholder-count="48">
            <div class="col" style="{{c.style}}">
              <sc-if value="{{c.lantern}}" hint-placeholder-val="{{ false }}">
                <div class="lan"><div class="lan-glow" style="{{c.glowStyle}}"></div><div class="lan-cap"></div><div class="lan-head" style="{{c.headStyle}}"></div><div class="lan-post"></div></div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <!-- 機種を選ぶ -->
  <section class="stratum tex s-soil" style="padding-top: 72px">
    <div class="wrap">
      <p class="depth">Y=48</p>
      <h2 class="disp h2">どこで遊んでいますか？</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 28px; margin-top: 34px; align-items: stretch">
        <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px" role="group" aria-label="機種">
          <sc-for list="{{devices}}" as="d" hint-placeholder-count="4">
            <button type="button" class="{{d.cls}}" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}">
              <span class="dev-ic" aria-hidden="true">
                <sc-if value="{{d.isJava}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 14 14" style="shape-rendering: crispEdges"><rect x="1" y="2" width="12" height="8" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="5" y="11" width="4" height="1" fill="currentColor"></rect><rect x="3" y="12" width="8" height="1" fill="currentColor"></rect></svg></sc-if>
                <sc-if value="{{d.isBe}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 14 14" style="shape-rendering: crispEdges"><rect x="4" y="1" width="6" height="12" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="6" y="10" width="2" height="1" fill="currentColor"></rect></svg></sc-if>
                <sc-if value="{{d.isConsole}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 14 14" style="shape-rendering: crispEdges"><rect x="1" y="4" width="12" height="6" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="3" y="6" width="3" height="1" fill="currentColor"></rect><rect x="4" y="5" width="1" height="3" fill="currentColor"></rect><rect x="9" y="5" width="1" height="1" fill="currentColor"></rect><rect x="10" y="7" width="1" height="1" fill="currentColor"></rect></svg></sc-if>
                <sc-if value="{{d.isUnknown}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 14 14" style="shape-rendering: crispEdges"><rect x="4" y="2" width="6" height="2" fill="currentColor"></rect><rect x="9" y="3" width="2" height="3" fill="currentColor"></rect><rect x="6" y="6" width="4" height="2" fill="currentColor"></rect><rect x="6" y="8" width="2" height="1" fill="currentColor"></rect><rect x="6" y="10" width="2" height="2" fill="currentColor"></rect></svg></sc-if>
              </span>
              <span style="display: flex; flex-direction: column; line-height: 1.45">
                <span style="font-weight: 700; font-size: 17px">{{d.name}}</span>
                <span class="mu" style="font-size: 14px">{{d.hint}}</span>
              </span>
            </button>
          </sc-for>
        </div>

        <div class="pn" style="flex: 999 1 560px; min-width: 0; padding: 32px">
          <sc-for list="{{devices}}" as="d" hint-placeholder-count="1">
            <sc-if value="{{d.on}}" hint-placeholder-val="{{ true }}">
              <div class="panel">
                <h3 class="disp" style="margin: 0 0 20px; font-size: 28px; line-height: 1.35">{{d.title}}</h3>
                <sc-if value="{{d.isUnknown}}" hint-placeholder-val="{{ false }}">
                  <p style="margin: 0 0 22px; font-size: 17px; line-height: 1.95">タイトル画面の下に「Minecraft: Java Edition」と書かれていればJava版です。Switch、PlayStation、Xbox、スマホ、タブレットで遊んでいるなら統合版です。</p>
                  <div style="display: flex; flex-wrap: wrap; gap: 12px">
                    <button type="button" class="pbtn sm" onClick="{{pickJava}}">Java版だった</button>
                    <button type="button" class="gbtn" onClick="{{pickBe}}" style="min-height: 44px">統合版だった</button>
                  </div>
                </sc-if>
                <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px">
                  <sc-for list="{{d.steps}}" as="st" hint-placeholder-count="4">
                    <li class="rise" style="{{st.anim}}"><div style="display: flex; gap: 16px; align-items: flex-start"><span class="num">{{st.n}}</span><span style="font-size: 17px; line-height: 1.85; padding-top: 4px">{{st.t}}</span></div></li>
                  </sc-for>
                </ol>
                <sc-if value="{{d.showAddr}}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 8px">
                    <div class="addr">
                      <span class="addr-t dot">tomoshibara.example</span>
                      <sc-if value="{{d.isBe}}" hint-placeholder-val="{{ false }}"><span class="addr-t dot" style="flex: 0 0 auto; border-left: 2px solid rgba(233,238,246,.15)">ポート 19132</span></sc-if>
                      <button type="button" class="{{copyCls}}" onClick="{{copy}}">{{copyLabel}}</button>
                    </div>
                    <p role="status" class="mu" style="margin: 0; font-size: 14px; min-height: 1.6em">{{copyStatus}}</p>
                  </div>
                </sc-if>
                <p class="mu" style="margin: 18px 0 0; font-size: 14px">対応バージョン：[対応バージョン]</p>
              </div>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </div>
  </section>

  <!-- 最初の夜 -->
  <section class="stratum tex s-stone">
    <div class="edge"></div>
    <div class="wrap">
      <p class="depth">Y=0</p>
      <h2 class="disp h2">最初の夜の流れ</h2>
      <p class="lead">ひとりで放り出されることはありません。最初の夜は、灯りと先輩が待っています。</p>
      <ol class="tl" style="list-style: none; margin: 48px 0 0; padding: 0">
        <sc-for list="{{timeline}}" as="t" hint-placeholder-count="4">
          <li class="tl-i">
            <sc-if value="{{t.line}}" hint-placeholder-val="{{ true }}"><span class="tl-line" aria-hidden="true"></span></sc-if>
            <div class="tl-lamp" aria-hidden="true"><span class="tl-cap"></span><span class="tl-head"></span></div>
            <p class="dot" style="margin: 18px 0 4px; font-size: 22px; color: #F2B544">{{t.t}}</p>
            <h3 class="disp" style="margin: 0 0 8px; font-size: 22px; line-height: 1.4">{{t.h}}</h3>
            <p class="mu" style="margin: 0 0 28px; font-size: 15px; line-height: 1.85">{{t.d}}</p>
          </li>
        </sc-for>
      </ol>
    </div>
  </section>

  <!-- きまり と 質問 -->
  <section class="stratum tex s-deep">
    <div class="edge"></div>
    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px 72px">
      <div style="flex: 1 1 380px; min-width: 0">
        <p class="depth">Y=−48</p>
        <h2 class="disp h2">灯原のきまり</h2>
        <ul style="list-style: none; margin: 18px 0 0; padding: 0; border-top: 2px solid rgba(255,255,255,.08)">
          <li class="rule"><span class="rule-b"></span>ほかの人の建物やチェストには触れない。土地は自動で保護されます。</li>
          <li class="rule"><span class="rule-b"></span>チャットでの暴言、しつこい勧誘はしない。</li>
          <li class="rule"><span class="rule-b"></span>有利になる改造クライアントは禁止。見た目や動作を軽くするMODは使えます。</li>
          <li class="rule"><span class="rule-b"></span>配信と録画は自由。ただし、切り抜きで特定の人を攻撃しない。</li>
          <li class="rule"><span class="rule-b"></span>困ったら /help を入力するか、灯守（スタッフ）に声をかける。</li>
        </ul>
      </div>
      <div style="flex: 1 1 460px; min-width: 0">
        <p class="depth">Y=−60</p>
        <h2 class="disp h2">よくある質問</h2>
        <div style="border-top: 2px solid rgba(255,255,255,.1)">
          <sc-for list="{{faqs}}" as="q" hint-placeholder-count="5">
            <div style="border-bottom: 2px solid rgba(255,255,255,.1)">
              <h3 style="margin: 0; font-size: inherit">
                <button type="button" class="q" onClick="{{q.toggle}}" aria-expanded="{{q.expanded}}" aria-controls="{{q.id}}"><span>{{q.q}}</span><span class="sign" aria-hidden="true">{{q.sign}}</span></button>
              </h3>
              <sc-if value="{{q.open}}" hint-placeholder-val="{{ false }}">
                <p class="rise mu" id="{{q.id}}" style="margin: 0; padding: 0 48px 22px 0; font-size: 16px; line-height: 1.95">{{q.a}}</p>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </section>

  <footer class="foot s-rock">
    <div class="edge"></div>
    <div class="wrap" style="display: flex; flex-direction: column; gap: 26px">
      <h2 class="disp" style="margin: 0; font-size: clamp(30px, 4.6vw, 58px); line-height: 1.3">夜は、ひとりより大勢で。</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a href="events.html" class="pbtn">今週の夜祭を見る</a>
        <a href="community.html" class="gbtn">友達を誘う</a>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding-top: 22px; border-top: 2px solid rgba(255,255,255,.08)">
        <nav aria-label="フッター" style="display: flex; flex-wrap: wrap; gap: 2px 8px">
          <a href="index.html" class="fl">トップ</a><a href="season.html" class="fl">シーズン</a><a href="events.html" class="fl">夜祭</a><a href="community.html" class="fl">仲間と遊ぶ</a>
        </nav>
        <p class="mu" style="margin: 0; font-size: 13px; max-width: 34em">灯原は非公式のファンサーバーで、Mojang Studios および Microsoft とは関係ありません。</p>
      </div>
    </div>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dev: 'java', faq: 0, copied: false };
    this.D = this.build();
    this.setHero = (el) => { this.heroEl = el; };
    this.onMove = (e) => {
      const el = this.heroEl; if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (((e.clientX - r.left) / r.width - 0.5) * 2).toFixed(3));
      el.style.setProperty('--my', (((e.clientY - r.top) / r.height - 0.5) * 2).toFixed(3));
    };
    this.pickJava = () => this.setState({ dev: 'java' });
    this.pickBe = () => this.setState({ dev: 'be' });
    this.copy = () => {
      try { if (navigator.clipboard) navigator.clipboard.writeText('tomoshibara.example'); } catch (e) {}
      this.setState({ copied: true }); clearTimeout(this._t);
      this._t = setTimeout(() => this.setState({ copied: false }), 1800);
    };
  }
  componentWillUnmount() { clearTimeout(this._t); }

  build() {
    let s = 23;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const stars = [];
    for (let i = 0; i < 44; i++) {
      const d = 1.4 + r() * 1.6, t = 2 + r() * 3, z = r() > 0.85 ? 4 : 2;
      stars.push({ style: 'left:' + (r() * 100).toFixed(2) + '%;top:' + (r() * 60).toFixed(2) + '%;width:' + z + 'px;height:' + z + 'px;animation-delay:' + d.toFixed(2) + 's,' + (d + r() * 3).toFixed(2) + 's;animation-duration:1s,' + t.toFixed(2) + 's' });
    }
    let p = '0,250';
    for (let x = 0; x < 960; x += 32) { const y = Math.round((250 - (140 + 36 * Math.sin(x / 110) + 20 * Math.sin(x / 47))) / 8) * 8; p += ' ' + x + ',' + y + ' ' + (x + 32) + ',' + y; }
    p += ' 960,250';
    const lanternAt = { 8: 0, 22: 1, 39: 2 };
    const cols = [];
    for (let i = 0; i < 48; i++) {
      const h = Math.max(2, Math.round(3 + 1.1 * Math.sin(i * 0.37) + 0.9 * Math.sin(i * 0.15 + 1)));
      const li = lanternAt[i]; const d = 2.4 + (li || 0) * 0.35;
      cols.push({ style: 'height:' + (h * 22) + 'px', lantern: li !== undefined, headStyle: 'animation-delay:' + d.toFixed(2) + 's', glowStyle: 'animation-delay:' + d.toFixed(2) + 's,' + (d + 0.8).toFixed(2) + 's' });
    }
    const devices = [
      { id: 'java', name: 'PC（Java版）', hint: 'ランチャーから起動する版', title: 'Java版の参加方法', showAddr: true,
        steps: ['Minecraft: Java Edition を起動し、「マルチプレイ」を選びます。', '「サーバーを追加」を押します。', '「サーバーアドレス」に下のアドレスを貼り付けて「完了」を押します。', '一覧に出た灯原を選び、「サーバーに接続」を押せば参加できます。'] },
      { id: 'be', name: 'スマホ・タブレット・PC（統合版）', hint: 'ストアのアプリから起動する版', title: '統合版の参加方法', showAddr: true,
        steps: ['Minecraft を起動し、「遊ぶ」から「サーバー」タブを開きます。', '一覧のいちばん下にある「サーバーを追加」を押します。', 'サーバー名に「灯原」、アドレスに下のアドレス、ポートに 19132 を入力します。', '保存したら灯原を選んで参加できます。'] },
      { id: 'console', name: 'Switch・PS・Xbox', hint: 'ゲーム機の統合版', title: 'ゲーム機からの参加方法', showAddr: false,
        steps: ['Minecraft のフレンド検索で、灯原の参加用アカウント [参加用アカウント名] をフレンドに追加します。', '「遊ぶ」から「フレンド」タブを開きます。', '参加できるワールドの一覧に出てくる灯原を選べば参加できます。'] },
      { id: 'unknown', name: 'わからない', hint: '見分け方を見る', title: 'どちらの版か見分ける', showAddr: false, steps: [] }
    ];
    const timeline = [
      { t: '0分', h: 'スポーン地点に到着', d: '看板を読みながら歩くだけの短いチュートリアル。飛ばしても大丈夫です。' },
      { t: '3分', h: '灯籠を3基受け取る', d: '最初の夜を越えるための灯籠が、持ち物に入ります。' },
      { t: '10分', h: '灯路に沿って開拓地へ', d: '先輩たちの灯路をたどれば、夜でも安全に移動できます。' },
      { t: '最初の夜', h: '灯守が案内', d: '「灯守（ともしもり）」の名札をつけたプレイヤーが、質問に答えます。' }
    ];
    const faqs = [
      { q: '参加にお金はかかりますか？', a: '参加もプレイも無料です。[支援の仕組みがあればここに記載]' },
      { q: '子どもだけで遊んでも大丈夫ですか？', a: 'チャットは不適切な言葉を自動で伏せ字にし、灯守が見回っています。保護者の方からの連絡は [保護者向けの連絡先] で受け付けます。' },
      { q: '建築を壊されたらどうなりますか？', a: '建てた土地は自動で保護され、他のプレイヤーは壊せません。万一被害があっても、ブロックの履歴から運営が元に戻します。' },
      { q: 'フレンドと同じ場所から始めたい', a: 'ログイン後に /party コマンドでパーティーを組むと、同じ地点からスタートできます。' },
      { q: 'Java版と統合版で一緒に遊べますか？', a: 'どちらからでも同じワールドに入れます。チャットも建築も共通です。' }
    ];
    return { stars, cols, devices, timeline, faqs, farPts: p };
  }

  renderVals() {
    const st = this.state, D = this.D;
    const devices = D.devices.map((d) => ({
      name: d.name, hint: d.hint, title: d.title, showAddr: d.showAddr,
      isJava: d.id === 'java', isBe: d.id === 'be', isConsole: d.id === 'console', isUnknown: d.id === 'unknown',
      on: d.id === st.dev, cls: d.id === st.dev ? 'opt on' : 'opt', pressed: d.id === st.dev ? 'true' : 'false',
      pick: () => this.setState({ dev: d.id }),
      steps: d.steps.map((t, i) => ({ t, n: i + 1, anim: 'animation-delay:' + (i * 0.08).toFixed(2) + 's' }))
    }));
    const timeline = D.timeline.map((t, i) => Object.assign({ line: i < D.timeline.length - 1 }, t));
    const faqs = D.faqs.map((f, i) => ({
      q: f.q, a: f.a, id: 'jf-' + i, open: st.faq === i, expanded: st.faq === i ? 'true' : 'false',
      sign: st.faq === i ? '−' : '+', toggle: () => this.setState({ faq: st.faq === i ? -1 : i })
    }));
    return {
      stars: D.stars, cols: D.cols, farPts: D.farPts, setHero: this.setHero, onMove: this.onMove,
      devices, timeline, faqs, pickJava: this.pickJava, pickBe: this.pickBe, copy: this.copy,
      copyCls: st.copied ? 'pbtn done' : 'pbtn', copyLabel: st.copied ? 'コピーしました' : 'アドレスをコピー',
      copyStatus: st.copied ? 'コピーしました。手順3で貼り付けてください。' : ''
    };
  }
}
</script>
