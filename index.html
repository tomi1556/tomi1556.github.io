<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="灯籠をつないで夜の世界を広げる、Java版・統合版対応のMinecraftサバイバルサーバー「灯原」。">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<title>灯原 トップ</title>
<link rel="stylesheet" href="./assets/tomo.css">
</head>
<body>
<div id="app"></div>
<template id="dc">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=DotGothic16&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0A1226}
a{color:#F2B544}a:hover{color:#FFD98A}
.tb .chip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;border:2px solid rgba(242,181,68,.55);background:rgba(10,16,34,.55);color:#F1E2C0;text-decoration:none;font-weight:700;font-size:14px;min-height:44px;transition:border-color .15s,color .15s}
.tb .chip:hover{border-color:#F2B544;color:#FFFFFF}
.chip-dot{width:8px;height:8px;background:#F2B544;box-shadow:0 0 10px 2px rgba(242,181,68,.8);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.grid{position:relative;display:grid;grid-template-columns:repeat(18,minmax(0,1fr))}
.tb .tile{aspect-ratio:1/1;border:0;padding:0;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22);transition:background-color .35s ease;display:grid;place-items:center;min-width:0}
.tb .tile:hover{box-shadow:inset 0 0 0 2px #FFD98A}
.mini{width:42%;height:54%;background:#F2B544;border:2px solid #2A1E16;box-shadow:0 0 14px 4px rgba(242,181,68,.7);animation:pop .3s steps(3) both;pointer-events:none}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.links path{fill:none;stroke:#FFE3A3;stroke-width:.12;stroke-dasharray:.25 .2;animation:flow2 1.4s linear infinite}
@keyframes flow2{to{stroke-dashoffset:-.45}}
.stat{display:flex;flex-direction:column;gap:2px;padding:16px 0;border-bottom:2px solid rgba(255,255,255,.08)}
.stat-n{font-family:'DotGothic16',sans-serif;font-size:40px;line-height:1.1;color:#F2B544}
.tb .band{display:block;color:#F2F3F5;text-decoration:none;transition:filter .2s}
.tb .band:hover{filter:brightness(1.14);color:#FFFFFF}
.band-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 56px;padding-top:48px;padding-bottom:48px}
.band-y{flex:0 0 190px;font-family:'DotGothic16',sans-serif;font-size:40px;line-height:1.2;color:#D6D9DE}
.band-body{flex:1 1 420px;min-width:0}
.band-go{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:#F2B544;margin-top:14px}
.band-lamp{width:10px;height:12px;background:#5A5040;transition:background .2s,box-shadow .2s}
.tb .band:hover .band-lamp{background:#F2B544;box-shadow:0 0 12px 3px rgba(242,181,68,.7)}
.garland{position:relative;height:150px}
.gl{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:swing 3.4s ease-in-out infinite}
.gl-str{width:2px;background:rgba(238,234,248,.35)}
.gl-cap{width:18px;height:4px;background:#2A1E16}
.gl-head{width:22px;height:28px;border:3px solid #2A1E16}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.cd{display:flex;flex-wrap:wrap;gap:10px}
.cd-u{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:10px 12px;background:rgba(0,0,0,.28);border:2px solid rgba(238,234,248,.14)}
.cd-n{font-family:'DotGothic16',sans-serif;font-size:38px;line-height:1.1}
</style>
</helmet>

<div class="tb" style="width: 100%">

  <!-- 夜空のヒーロー -->
  <div class="hero" ref="{{setHero}}" onMouseMove="{{onMove}}" style="min-height: 900px">
    <div class="sky"></div>
    <div class="stars">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="30"><span class="star" style="{{s.style}}"></span></sc-for>
    </div>
    <span class="shoot"></span>
    <div class="moon"></div>
    <div class="dusk"></div>

    <header class="hdr">
      <div class="wrap hdr-in">
        <a href="index.html" class="logo">
          <svg width="30" height="36" viewBox="0 0 10 12" aria-hidden="true" style="display: block; shape-rendering: crispEdges"><rect x="2" y="0" width="6" height="1" fill="currentColor"></rect><rect x="1" y="1" width="8" height="1" fill="currentColor"></rect><rect x="1" y="2" width="1" height="6" fill="currentColor"></rect><rect x="8" y="2" width="1" height="6" fill="currentColor"></rect><rect x="2" y="2" width="6" height="6" fill="#F2B544"></rect><rect x="4" y="4" width="2" height="2" fill="#FFF1C4"></rect><rect x="1" y="8" width="8" height="1" fill="currentColor"></rect><rect x="4" y="9" width="2" height="3" fill="currentColor"></rect></svg>
          <span class="disp" style="font-size: 26px; line-height: 1">灯原</span>
        </a>
        <nav class="nav" aria-label="メイン">
          <a href="index.html" class="nl cur" aria-current="page"><span class="nl-lamp"></span>トップ</a>
          <a href="join.html" class="nl"><span class="nl-lamp"></span>はじめる</a>
          <a href="season.html" class="nl"><span class="nl-lamp"></span>シーズン</a>
          <a href="events.html" class="nl"><span class="nl-lamp"></span>夜祭</a>
          <a href="community.html" class="nl"><span class="nl-lamp"></span>仲間と遊ぶ</a>
        </nav>
      </div>
    </header>

    <div class="wrap" style="position: relative; z-index: 3; padding-top: 56px; padding-bottom: 40px">
      <a href="season.html" class="chip fadein">
        <span class="chip-dot"></span>
        <span>シーズン3「灯ノ海」</span>
        <span class="dot" style="font-size: 16px; font-weight: 400">{{cdShort}}</span>
      </a>
      <h1 class="disp reveal" style="margin: 26px 0 0; font-size: clamp(44px, 7.4vw, 108px); line-height: 1.12; white-space: pre-line">灯りをつないで、
夜の果てまで。</h1>
      <p class="lead fadein" style="margin-top: 28px; font-size: 18px">灯原は、プレイヤーが建てた灯籠がつながって、夜の世界を少しずつ広げていくサバイバルサーバーです。Java版でも統合版（Switch、スマホ、PC）でも、同じ世界に入れます。</p>
      <div class="fadein" style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; align-items: stretch">
        <div class="addr" style="flex: 1 1 400px; max-width: 580px">
          <span class="addr-t dot">tomoshibara.example</span>
          <button type="button" class="{{heroBtnCls}}" onClick="{{copyHero}}">{{heroBtnLabel}}</button>
        </div>
        <a href="join.html" class="gbtn">はじめての方へ</a>
      </div>
      <p role="status" class="mu" style="margin: 10px 0 0; font-size: 14px; min-height: 1.6em">{{heroStatus}}</p>
    </div>

    <div class="scene" aria-hidden="true" style="height: 330px">
      <div class="layer l1" style="height: 260px">
        <svg viewBox="0 0 960 250" preserveAspectRatio="none"><polygon points="{{farPts}}" fill="#17274E"></polygon></svg>
      </div>
      <div class="layer l2" style="height: 210px">
        <svg viewBox="0 0 960 200" preserveAspectRatio="none"><polygon points="{{midPts}}" fill="#1F3460"></polygon></svg>
      </div>
      <div class="layer l3" style="height: 300px">
        <sc-for list="{{flies}}" as="f" hint-placeholder-count="10"><span class="fly" style="{{f.style}}"></span></sc-for>
        <div class="terrain">
          <sc-for list="{{cols}}" as="c" hint-placeholder-count="48">
            <div class="col" style="{{c.style}}">
              <sc-if value="{{c.lantern}}" hint-placeholder-val="{{ false }}">
                <div class="lan">
                  <div class="lan-glow" style="{{c.glowStyle}}"></div>
                  <div class="lan-cap"></div>
                  <div class="lan-head" style="{{c.headStyle}}"></div>
                  <div class="lan-post"></div>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <svg class="road" viewBox="0 0 1440 300" preserveAspectRatio="none">
          <polyline class="road-base" points="{{roadPts}}" pathLength="100" style="animation-delay: 4.7s"></polyline>
          <polyline class="road-flow" points="{{roadPts}}" pathLength="100" style="animation-delay: 7.2s, 7.2s"></polyline>
        </svg>
      </div>
    </div>
  </div>

  <!-- 土：ルール体験 -->
  <section class="stratum tex s-soil" id="rule">
    <div class="wrap">
      <p class="depth">Y=48</p>
      <h2 class="disp h2">ルールは、ひとつだけ。</h2>
      <p class="lead">灯籠のまわりでは敵が湧きません。近くに建てた灯籠どうしは「灯路」でつながり、灯路の上は足が速くなります。灯りをつなぐほど、夜の世界は広がっていきます。</p>

      <div style="display: flex; flex-wrap: wrap; gap: 28px; margin-top: 44px; align-items: flex-start">
        <div class="pn" style="flex: 999 1 620px; min-width: 0; padding: 16px">
          <p style="margin: 0 0 12px; font-weight: 700; font-size: 15px">マスを押すと灯籠を置けます。もう一度押すと取り除きます。</p>
          <div class="grid">
            <sc-for list="{{tiles}}" as="t" hint-placeholder-count="144">
              <button type="button" class="tile" style="{{t.style}}" onClick="{{t.tap}}" aria-label="{{t.label}}" aria-pressed="{{t.pressed}}">
                <sc-if value="{{t.has}}" hint-placeholder-val="{{ false }}"><span class="mini"></span></sc-if>
              </button>
            </sc-for>
            <svg class="links" viewBox="0 0 18 8" preserveAspectRatio="none" aria-hidden="true"><path d="{{linkD}}"></path></svg>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 13px" class="mu">
            <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; background: #6FA347"></span>灯りの届く草地</span>
            <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; background: #1F3322; border: 1px solid #6F7D6A"></span>暗い草地</span>
            <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 14px; height: 14px; background: #13213F; border: 1px solid #5D6E92"></span>水（置けない）</span>
          </div>
        </div>

        <div style="flex: 1 1 260px; min-width: 0">
          <div class="stat" style="border-top: 2px solid rgba(255,255,255,.08)"><span class="mu" style="font-size: 14px; font-weight: 700">置いた灯籠</span><span class="stat-n">{{nLan}}<span style="font-size: 20px; color: #D9C7AF"> / 12</span></span></div>
          <div class="stat"><span class="mu" style="font-size: 14px; font-weight: 700">敵が湧かないマス</span><span class="stat-n">{{nSafe}}</span></div>
          <div class="stat"><span class="mu" style="font-size: 14px; font-weight: 700">つながった灯路</span><span class="stat-n">{{nRoad}}<span style="font-size: 20px; color: #D9C7AF"> 本</span></span></div>
          <div class="stat"><span class="mu" style="font-size: 14px; font-weight: 700">いちばん大きな灯路網</span><span class="stat-n">{{nNet}}<span style="font-size: 20px; color: #D9C7AF"> 基</span></span></div>
          <p role="status" style="margin: 16px 0 0; min-height: 3.6em; font-size: 15px; font-weight: 700; color: #FFE3A3">{{msg}}</p>
          <button type="button" class="gbtn" onClick="{{reset}}" style="margin-top: 6px">最初の配置に戻す</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 石：遊ぶ理由 -->
  <section class="s-stone" style="position: relative">
    <div class="edge"></div>
    <div class="wrap" style="padding-top: 100px; padding-bottom: 40px">
      <p class="depth">Y=0</p>
      <h2 class="disp h2">灯原で遊ぶ理由</h2>
    </div>
    <a href="season.html" class="band" style="background: #50555C">
      <div class="wrap band-in">
        <span class="band-y">Y=−12</span>
        <div class="band-body">
          <h3 class="disp" style="margin: 0; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.35">3か月ごとに、新しい夜。</h3>
          <p class="lead" style="margin-top: 10px">シーズンごとに世界をまっさらに作り直します。全員が同じ日に、同じ場所から出発。前のシーズンの世界は、歩ける地図として残ります。</p>
          <span class="band-go"><span class="band-lamp"></span>シーズンについて</span>
        </div>
      </div>
    </a>
    <a href="join.html" class="band" style="background: #474C53">
      <div class="wrap band-in">
        <span class="band-y">Y=−24</span>
        <div class="band-body">
          <h3 class="disp" style="margin: 0; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.35">Switchでも、スマホでも。</h3>
          <p class="lead" style="margin-top: 10px">Java版と統合版が同じ世界に入れます。PCの友達とも、ゲーム機の友達とも一緒に遊べます。</p>
          <span class="band-go"><span class="band-lamp"></span>参加方法を見る</span>
        </div>
      </div>
    </a>
    <a href="events.html" class="band" style="background: #3E4249">
      <div class="wrap band-in">
        <span class="band-y">Y=−36</span>
        <div class="band-body">
          <h3 class="disp" style="margin: 0; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.35">毎週土曜21時は、夜祭。</h3>
          <p class="lead" style="margin-top: 10px">毎週同じ時間に、全員参加のミニゲーム。この時間にログインすれば、必ず誰かがいます。</p>
          <span class="band-go"><span class="band-lamp"></span>夜祭の予定を見る</span>
        </div>
      </div>
    </a>
    <a href="community.html" class="band" style="background: #34383E; padding-bottom: 40px">
      <div class="wrap band-in">
        <span class="band-y">Y=−48</span>
        <div class="band-body">
          <h3 class="disp" style="margin: 0; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.35">友達を呼ぶと、灯りの色が増える。</h3>
          <p class="lead" style="margin-top: 10px">招待した人もされた人も、灯籠の色がひとつ増えます。特典は見た目だけで、強さはお金でも招待でも変わりません。</p>
          <span class="band-go"><span class="band-lamp"></span>招待のしくみ</span>
        </div>
      </div>
    </a>
  </section>

  <!-- 夜祭の告知 -->
  <section class="stratum s-dusk" style="padding-top: 72px">
    <div class="edge"></div>
    <div class="garland" aria-hidden="true">
      <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 100%; height: 60px"><path d="M0 2 Q50 40 100 2" fill="none" stroke="rgba(238,234,248,.35)" stroke-width="0.4"></path></svg>
      <sc-for list="{{garland}}" as="g" hint-placeholder-count="11">
        <div class="gl" style="{{g.style}}">
          <span class="gl-str" style="{{g.str}}"></span>
          <span class="gl-cap"></span>
          <span class="gl-head" style="{{g.head}}"></span>
        </div>
      </sc-for>
    </div>
    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px 64px; align-items: flex-end">
      <div style="flex: 1 1 460px; min-width: 0">
        <p class="depth">次の夜祭</p>
        <h2 class="disp h2" style="margin-bottom: 8px">{{festDate}}</h2>
        <p class="mu" style="margin: 0 0 22px; font-size: 17px">{{festLead}}</p>
        <div class="cd" role="timer" aria-label="夜祭まで">
          <div class="cd-u"><span class="cd-n">{{fcd.d}}</span><span class="mu" style="font-size: 13px">日</span></div>
          <div class="cd-u"><span class="cd-n">{{fcd.h}}</span><span class="mu" style="font-size: 13px">時間</span></div>
          <div class="cd-u"><span class="cd-n">{{fcd.m}}</span><span class="mu" style="font-size: 13px">分</span></div>
          <div class="cd-u"><span class="cd-n">{{fcd.s}}</span><span class="mu" style="font-size: 13px">秒</span></div>
        </div>
      </div>
      <div class="pn" style="flex: 1 1 380px; min-width: 0; padding: 28px">
        <p class="mu" style="margin: 0; font-size: 14px; font-weight: 700">今週のゲーム</p>
        <h3 class="disp" style="margin: 6px 0 10px; font-size: 32px; line-height: 1.3; color: #F6B8CE">{{game.name}}</h3>
        <p style="margin: 0 0 22px; font-size: 16px; line-height: 1.9">{{game.desc}}</p>
        <a href="events.html" class="pbtn sm">夜祭の予定を見る</a>
      </div>
    </div>
  </section>

  <footer class="foot s-rock">
    <div class="edge"></div>
    <div class="wrap" style="display: flex; flex-direction: column; gap: 26px">
      <h2 class="disp" style="margin: 0; font-size: clamp(30px, 4.6vw, 58px); line-height: 1.3">夜は、ひとりより大勢で。</h2>
      <div class="addr" style="max-width: 580px">
        <span class="addr-t dot">tomoshibara.example</span>
        <button type="button" class="{{footBtnCls}}" onClick="{{copyFoot}}">{{footBtnLabel}}</button>
      </div>
      <p role="status" class="mu" style="margin: -14px 0 0; font-size: 14px; min-height: 1.6em">{{footStatus}}</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding-top: 22px; border-top: 2px solid rgba(255,255,255,.08)">
        <nav aria-label="フッター" style="display: flex; flex-wrap: wrap; gap: 2px 8px">
          <a href="join.html" class="fl">はじめる</a><a href="season.html" class="fl">シーズン</a><a href="events.html" class="fl">夜祭</a><a href="community.html" class="fl">仲間と遊ぶ</a>
        </nav>
        <p class="mu" style="margin: 0; font-size: 13px; max-width: 34em">灯原は非公式のファンサーバーで、Mojang Studios および Microsoft とは関係ありません。</p>
      </div>
    </div>
  </footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"seasonStart":{"editor":"text","default":"2026-11-07T21:00:00+09:00"},"$preview":{"width":1440,"height":4300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { now: Date.now(), copied: '', lan: [57, 42, 81], msg: '' };
    this.D = this.build();
    this.taps = this.D.kinds.map((k, i) => () => this.tap(i));
    this.setHero = (el) => { this.heroEl = el; };
    this.onMove = (e) => {
      const el = this.heroEl; if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (((e.clientX - r.left) / r.width - 0.5) * 2).toFixed(3));
      el.style.setProperty('--my', (((e.clientY - r.top) / r.height - 0.5) * 2).toFixed(3));
    };
    this.copyHero = () => this.copy('hero');
    this.copyFoot = () => this.copy('foot');
    this.reset = () => this.setState({ lan: [57, 42, 81], msg: '最初の配置に戻しました。' });
  }
  componentDidMount() { this._iv = setInterval(() => this.setState({ now: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this._iv); clearTimeout(this._t); }

  build() {
    let s = 11;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const stars = [];
    for (let i = 0; i < 64; i++) {
      const d = 1.6 + r() * 1.8, t = 2 + r() * 3, z = r() > 0.85 ? 4 : 2;
      stars.push({ style: 'left:' + (r() * 100).toFixed(2) + '%;top:' + (r() * 58).toFixed(2) + '%;width:' + z + 'px;height:' + z + 'px;animation-delay:' + d.toFixed(2) + 's,' + (d + r() * 3).toFixed(2) + 's;animation-duration:1s,' + t.toFixed(2) + 's' });
    }
    const hills = (w, h, step, base, amp, f1, f2, tree) => {
      let p = '0,' + h;
      for (let x = 0; x < w; x += step) {
        const y = Math.max(4, Math.round((h - (base + amp * Math.sin(x / f1) + amp * 0.55 * Math.sin(x / f2 + 1.3))) / 8) * 8);
        if (tree && r() < tree) {
          const a = x + step * 0.2, b = x + step * 0.8;
          p += ' ' + x + ',' + y + ' ' + a + ',' + y + ' ' + a + ',' + (y - 24) + ' ' + b + ',' + (y - 24) + ' ' + b + ',' + y + ' ' + (x + step) + ',' + y;
        } else {
          p += ' ' + x + ',' + y + ' ' + (x + step) + ',' + y;
        }
      }
      return p + ' ' + w + ',' + h;
    };
    const lanternAt = { 4: 0, 10: 1, 17: 2, 24: 3, 30: 4, 37: 5, 44: 6 };
    const cols = []; const road = [];
    for (let i = 0; i < 48; i++) {
      const h = Math.max(3, Math.round(4 + 1.6 * Math.sin(i * 0.42) + 1.2 * Math.sin(i * 0.19 + 2) + (r() > 0.8 ? 1 : 0)));
      const li = lanternAt[i]; const has = li !== undefined;
      const d = 2.6 + (has ? li : 0) * 0.3;
      cols.push({ style: 'height:' + (h * 26) + 'px', lantern: has, headStyle: 'animation-delay:' + d.toFixed(2) + 's', glowStyle: 'animation-delay:' + d.toFixed(2) + 's,' + (d + 0.8).toFixed(2) + 's' });
      if (has) road.push(((i + 0.5) * 30).toFixed(0) + ',' + (300 - h * 26 - 40));
    }
    const flies = [];
    for (let i = 0; i < 14; i++) flies.push({ style: 'left:' + (3 + r() * 94).toFixed(1) + '%;bottom:' + (120 + r() * 170).toFixed(0) + 'px;animation-delay:' + (3.5 + r() * 6).toFixed(2) + 's;animation-duration:' + (6 + r() * 4).toFixed(2) + 's' });
    const kinds = [];
    for (let y = 0; y < 8; y++) for (let x = 0; x < 18; x++) {
      const dx = x - 13.5, dy = y - 5;
      kinds.push(dx * dx / 7 + dy * dy / 2.5 < 1.6 ? 'w' : 'g');
    }
    const garland = [];
    for (let i = 0; i < 11; i++) {
      const t = (i + 0.5) / 11; const sag = 1 - Math.pow(2 * t - 1, 2);
      const pink = i % 2 === 1;
      garland.push({
        style: 'left:calc(' + (t * 100).toFixed(2) + '% - 11px);animation-delay:' + (-i * 0.37).toFixed(2) + 's',
        str: 'height:' + (6 + sag * 46 + (i % 3) * 10).toFixed(0) + 'px',
        head: 'background:' + (pink ? '#F29BB8' : '#F2B544') + ';box-shadow:0 0 22px 6px ' + (pink ? 'rgba(242,155,184,.5)' : 'rgba(242,181,68,.55)')
      });
    }
    return { stars, cols, flies, kinds, garland, roadPts: road.join(' '), farPts: hills(960, 250, 32, 150, 40, 120, 53, 0), midPts: hills(960, 200, 20, 96, 30, 80, 37, 0.22) };
  }

  edges(lan) {
    const out = [];
    for (let a = 0; a < lan.length; a++) for (let b = a + 1; b < lan.length; b++) {
      const ax = lan[a] % 18, ay = Math.floor(lan[a] / 18), bx = lan[b] % 18, by = Math.floor(lan[b] / 18);
      if ((ax - bx) * (ax - bx) + (ay - by) * (ay - by) <= 4.5 * 4.5) out.push([a, b]);
    }
    return out;
  }

  tap(i) {
    const lan = this.state.lan.slice(); const at = lan.indexOf(i);
    if (at >= 0) { lan.splice(at, 1); this.setState({ lan, msg: '灯籠を取り除きました。' }); return; }
    if (this.D.kinds[i] === 'w') { this.setState({ msg: '水の上には灯籠を置けません。' }); return; }
    if (lan.length >= 12) { this.setState({ msg: '灯籠は12基まで置けます。どれかを取り除いてください。' }); return; }
    const before = this.edges(lan).length; lan.push(i); const after = this.edges(lan).length;
    this.setState({ lan, msg: after > before ? '灯路がつながりました。灯路の上は足が速くなります。' : '灯籠を置きました。近くにもう1基置くと灯路がつながります。' });
  }

  copy(where) {
    try { if (navigator.clipboard) navigator.clipboard.writeText('tomoshibara.example'); } catch (e) {}
    this.setState({ copied: where });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ copied: '' }), 1800);
  }

  demo() {
    const key = this.state.lan.join(',');
    if (this._dk === key) return this._dv;
    const lan = this.state.lan; const kinds = this.D.kinds;
    const C = { g: ['#1F3322', '#4A7032', '#6FA347'], w: ['#13213F', '#2F5590', '#4F7FB8'] };
    let safe = 0;
    const tiles = kinds.map((k, i) => {
      const x = i % 18, y = Math.floor(i / 18);
      let dmin = 99;
      lan.forEach((j) => { const d = Math.max(Math.abs(j % 18 - x), Math.abs(Math.floor(j / 18) - y)); if (d < dmin) dmin = d; });
      const lvl = dmin <= 1 ? 2 : dmin === 2 ? 1 : 0;
      if (lvl > 0 && k !== 'w') safe++;
      const has = lan.indexOf(i) >= 0;
      return {
        style: 'background-color:' + C[k][lvl],
        has, pressed: has ? 'true' : 'false', tap: this.taps[i],
        label: (y + 1) + '行' + (x + 1) + '列、' + (k === 'w' ? '水' : '草地') + (has ? '、灯籠あり' : (lvl > 0 ? '、明るい' : '、暗い'))
      };
    });
    const es = this.edges(lan);
    const parent = lan.map((_, i) => i);
    const find = (a) => (parent[a] === a ? a : (parent[a] = find(parent[a])));
    es.forEach(([a, b]) => { parent[find(a)] = find(b); });
    const size = {}; let net = 0;
    lan.forEach((_, i) => { const p = find(i); size[p] = (size[p] || 0) + 1; if (size[p] > net) net = size[p]; });
    const linkD = es.map(([a, b]) => 'M' + (lan[a] % 18 + 0.5) + ' ' + (Math.floor(lan[a] / 18) + 0.5) + 'L' + (lan[b] % 18 + 0.5) + ' ' + (Math.floor(lan[b] / 18) + 0.5)).join(' ') || 'M0 0';
    this._dk = key;
    this._dv = { tiles, nSafe: safe, nRoad: es.length, nNet: net, linkD };
    return this._dv;
  }

  renderVals() {
    const st = this.state, D = this.D, now = st.now;
    const pad = (n) => String(n).padStart(2, '0');
    const split = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); return { d: String(Math.floor(t / 86400)), h: pad(Math.floor(t / 3600) % 24), m: pad(Math.floor(t / 60) % 60), s: pad(t % 60) }; };
    const start = Date.parse(this.props.seasonStart || '2026-11-07T21:00:00+09:00');
    const sc = split(start - now);
    const cdShort = isNaN(start) ? '開幕日 [日付]' : (start - now <= 0 ? '開催中' : '開幕まで ' + sc.d + '日 ' + sc.h + ':' + sc.m + ':' + sc.s);

    const nd = new Date(now);
    const fest = new Date(nd); fest.setHours(21, 0, 0, 0);
    fest.setDate(nd.getDate() + ((6 - nd.getDay() + 7) % 7));
    if (now > fest.getTime() + 90 * 60000) fest.setDate(fest.getDate() + 7);
    const live = now >= fest.getTime();
    const games = [
      { name: '灯籠リレー', desc: 'チームで灯籠をつなぎ、先に向こう岸まで灯路を通したほうが勝ち。' },
      { name: '闇かくれんぼ', desc: '灯りのない区域で、鬼から朝まで隠れきる。灯籠を置くと見つかりやすくなります。' },
      { name: '建築早押し', desc: 'お題の建物を15分で建て、参加者全員の投票で順位を決めます。' },
      { name: '夜明けまで', desc: '敵がいつもより多く湧く特別な夜を、灯籠だけを頼りに生き延びます。' }
    ];
    const game = games[Math.floor(fest.getTime() / 604800000) % 4];
    const hero = st.copied === 'hero', foot = st.copied === 'foot';
    const dm = this.demo();
    return Object.assign({
      stars: D.stars, cols: D.cols, flies: D.flies, garland: D.garland,
      roadPts: D.roadPts, farPts: D.farPts, midPts: D.midPts,
      setHero: this.setHero, onMove: this.onMove,
      cdShort,
      nLan: String(st.lan.length), msg: st.msg, reset: this.reset,
      festDate: (fest.getMonth() + 1) + '月' + fest.getDate() + '日（土）21:00',
      festLead: live ? 'ただいま開催中です。今すぐログインして参加できます。' : '毎週土曜の21時から約90分。参加は自由で、途中参加もできます。',
      fcd: split(fest.getTime() - now), game,
      copyHero: this.copyHero, copyFoot: this.copyFoot,
      heroBtnCls: hero ? 'pbtn done' : 'pbtn', heroBtnLabel: hero ? 'コピーしました' : 'アドレスをコピー',
      heroStatus: hero ? 'マルチプレイの「サーバーを追加」に貼り付けてください。' : '',
      footBtnCls: foot ? 'pbtn done' : 'pbtn', footBtnLabel: foot ? 'コピーしました' : 'アドレスをコピー',
      footStatus: foot ? 'マルチプレイの「サーバーを追加」に貼り付けてください。' : ''
    }, dm, { nSafe: String(dm.nSafe), nRoad: String(dm.nRoad), nNet: String(dm.nNet) });
  }
}
</script>
